name: Crawl and publish

# Hunt Flatpak apps, rebuild the static site, and deploy it to GitHub Pages at
# https://<owner>.github.io/flatsonar/.
#
# - schedule / workflow_dispatch: always run the crawl (that's the whole point of
#   the schedule — a catalogue that stays fresh without anyone running it by hand).
# - push: rebuilds and redeploys the site from whatever is already in
#   server/flatsonar.db, without re-crawling, so a template/CSS/code change shows
#   up immediately instead of waiting for the next scheduled crawl.
#
# The crawl commits the refreshed server/flatsonar.db back to this branch (see
# .gitignore: it is deliberately tracked) so first_seen dates, the "new in the
# catalogue" section and the Atom feed survive between runs instead of every app
# looking "new" on every run. `paths-ignore` on the push trigger stops that commit
# from re-triggering this workflow: it touches nothing else, so GitHub never even
# starts a run for it. `[skip ci]` in the message is just a documented convention
# on top, in case something else ever watches this repo's commits.

on:
  push:
    branches: [master, main]
    paths-ignore:
      - "server/flatsonar.db"
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC; a full crawl is heavier than it needs
                          # to be to run daily, see README > Hunting > Keeping it fresh
  workflow_dispatch:
    inputs:
      crawl:
        description: "Re-crawl before building (unchecked: just rebuild/redeploy from the current database)"
        type: boolean
        default: true
      limit:
        description: "Max apps/repos per source (blank = no limit, a real full crawl)"
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e core -e server

      - name: Crawl
        if: github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || inputs.crawl)
        working-directory: server
        env:
          # The token Actions injects automatically is enough for GitHub repo/code
          # search; set CRAWLER_GITHUB_TOKEN as a repo secret (a plain PAT, no
          # scopes needed for public data) for higher rate limits than that gives.
          # GITLAB_TOKEN / CODEBERG_TOKEN are optional repo secrets, same idea.
          GITHUB_TOKEN: ${{ secrets.CRAWLER_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          LIMIT="${{ inputs.limit }}"
          python -m flatsonar_server.crawler.run --source all --concurrency 12 -v \
            ${LIMIT:+--limit "$LIMIT"}

      - name: Checkpoint the database
        if: github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || inputs.crawl)
        working-directory: server
        run: python -c "import sqlite3; c = sqlite3.connect('flatsonar.db'); c.execute('PRAGMA wal_checkpoint(FULL)'); c.close()"

      - name: Build the static site
        run: python -m flatsonar_server.web.build --out public --site-url "$SITE_URL"

      - name: Commit the refreshed catalogue
        if: github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || inputs.crawl)
        run: |
          git config user.name "flatsonar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add server/flatsonar.db
          git diff --cached --quiet server/flatsonar.db || git commit -m "Crawl: refresh catalogue [skip ci]"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
