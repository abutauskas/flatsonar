name: Crawl and publish

# Hunt Flatpak apps, rebuild the static site, and deploy it to GitHub Pages at
# https://<owner>.github.io/flatsonar/ (or the custom domain in the SITE_URL
# repository variable, once one is set).
#
# - schedule / workflow_dispatch: always run the crawl (that's the whole point of
#   the schedule: a catalogue that stays fresh without anyone running it by hand).
# - push: rebuilds and redeploys the site from whatever is already in the
#   database, without re-crawling, so a template/CSS/code change shows up
#   immediately instead of waiting for the next scheduled crawl.
#
# The crawl writes straight to the Postgres database at DATABASE_URL (a repo
# secret; the Supabase connection-pooler URL, not the direct one, since GitHub's
# runners don't have IPv6). That database is what keeps first_seen dates, the
# "new in the catalogue" section and the Atom feed meaningful between runs, the
# same one the live server uses, so this workflow has nothing of its own to
# persist or commit back to the repo.

on:
  push:
    branches: [master, main]
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC; a full crawl is heavier than it needs
                          # to be to run daily, see README > Hunting > Keeping it fresh
  workflow_dispatch:
    inputs:
      crawl:
        description: "Re-crawl before building (unchecked: just rebuild/redeploy from the current database)"
        type: boolean
        default: true
      limit:
        description: "Max apps/repos per source (blank = no limit, a real full crawl)"
        required: false

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Set the SITE_URL repository variable once a custom domain is live (Settings ->
  # Secrets and variables -> Actions -> Variables) to point the sitemap and feed at
  # it; until then this falls back to the default github.io project-page address.
  SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e core -e "server[postgres]"

      - name: Crawl
        if: github.event_name != 'push' && (github.event_name != 'workflow_dispatch' || inputs.crawl)
        working-directory: server
        env:
          # The token Actions injects automatically is enough for GitHub repo/code
          # search; set CRAWLER_GITHUB_TOKEN as a repo secret (a plain PAT, no
          # scopes needed for public data) for higher rate limits than that gives.
          # GITLAB_TOKEN / CODEBERG_TOKEN are optional repo secrets, same idea.
          GITHUB_TOKEN: ${{ secrets.CRAWLER_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          LIMIT="${{ inputs.limit }}"
          python -m flatsonar_server.crawler.run --source all --concurrency 12 -v \
            ${LIMIT:+--limit "$LIMIT"}

      - name: Build the static site
        run: python -m flatsonar_server.web.build --out public --site-url "$SITE_URL"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
