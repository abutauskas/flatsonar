[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flatsonar-server"
version = "1.0.0"
description = "Flatsonar API server and crawler: hunts open-source Flatpak apps across Flathub, GitHub, GitLab and Codeberg"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "flatsonar-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "pydantic>=2",
    "pydantic-settings>=2",
    "pyyaml>=6",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]
postgres = ["psycopg[binary]>=3"]

[project.scripts]
flatsonar-crawl = "flatsonar_server.crawler.run:main"

[tool.setuptools.packages.find]
include = ["flatsonar_server*"]

[tool.setuptools.package-data]
flatsonar_server = ["web/templates/*", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
