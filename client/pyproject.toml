[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flatsonar"
version = "0.1.0"
description = "Flatsonar desktop client: an open-source Flatpak store (GTK4 + libadwaita)"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
# PyGObject itself comes from the distro (python3-gi); pip can't sensibly build it.
dependencies = ["flatsonar-core", "httpx>=0.27"]

[project.scripts]
flatsonar = "flatsonar.main:main"

[tool.setuptools.packages.find]
include = ["flatsonar*"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
